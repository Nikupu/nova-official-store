<!DOCTYPE html>
<html>
<input type="text" id="number" placeholder="Enter phone number">

<a href="#" onclick="openWhatsApp(); return false;">Open WhatsApp</a>

<script>
function openWhatsApp() {
    let number = document.getElementById("number").value;
    window.location.href = "https://wa.me/91" + number;
}
</script>
</body>
</html>

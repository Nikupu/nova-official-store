<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Opener</title>
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 150px;
            background-color: #25D366;
        }

        h1 {
            font-size: 45px;
        }

        input {
            width: 500px;
            padding: 20px;
            font-size: 25px;
            border: 2px solid #555;
            border-radius: 10px;
        }

        button {
            margin-top: 25px;
            padding: 18px 40px;
            font-size: 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Open WhatsApp</h1>

    <input type="text" id="number" placeholder="Enter phone number">

    <br>

    <button onclick="openWhatsApp()">Open WhatsApp</button>

    <script>
        function openWhatsApp() {
            let number = document.getElementById("number").value;
            window.location.href = "https://wa.me/91" + number;
        }
    </script>

</body>
</html>
